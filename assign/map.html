    <section class="card">

      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1800103.4230150871!2d81.51803195625!3d28.212568299999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3995950681125859%3A0x98bf80537f95f95c!2sSoul%20Origin%20Cafe%20and%20Restaurant!5e0!3m2!1sen!2s!4v1760798288684!5m2!1sen!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

<audio id="bgMusic" loop>
    <source src="asset/Dark Souls III OST 1 - Main Theme.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
<script>
    const btn = document.getElementById("themeToggle");
    const body = document.body;
    const musicBtn = document.getElementById("musicBtn");
    const music = document.getElementById("bgMusic");
    let playing = false;

  
    if (localStorage.getItem("theme") === "dark") {
      body.classList.add("dark");
      btn.textContent = "☀️ Light";
    }

    btn.onclick = () => {
      body.classList.toggle("dark");
      const isDark = body.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      btn.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    }
    musicBtn.onclick = () => {
      if (!playing) {
    music.play();
    musicBtn.textContent = "⏸️ Pause Music";
      } else {
    music.pause();
    musicBtn.textContent = "🎵 Play Music";
      }
    playing = !playing;
    };
  </script>
</html>
